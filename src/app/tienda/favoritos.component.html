<ActionBar title="Favoritos">
  <NavigationButton text="Menú" android.systemIcon="ic_menu_more" (tap)="abrirMenu()"></NavigationButton>
  <ActionItem text="Menú" ios.position="left" (tap)="abrirMenu()"></ActionItem>
</ActionBar>
<GridLayout rows="auto, auto, *" class="pagina" (loaded)="cargar()">
  <StackLayout row="0"><ns-barra-navegacion activa="favoritos"></ns-barra-navegacion></StackLayout>
  <Label row="1" *ngIf="!favoritos.length" text="No hay pedidos favoritos. Márcalos con ☆ en Buscar." class="vacio" textWrap="true"></Label>

  <ListView row="2" [items]="favoritos" separatorColor="transparent">
    <ng-template let-pedido="item">
      <GridLayout columns="*, auto" class="tarjeta">
        <StackLayout col="0">
          <Label [text]="pedido.codigo" class="codigo" textWrap="true"></Label>
          <Label [text]="'Monto total: ' + pedido.montoTotal.toFixed(2)" class="dato" textWrap="true"></Label>
          <Label [text]="'Dirección: ' + pedido.direccion" class="dato" textWrap="true"></Label>
          <Label [text]="'Entrega solicitada: ' + pedido.fechaEntregaSolicitada" class="dato" textWrap="true"></Label>
          <Button [text]="codigosEnLectura.has(pedido.codigo) ? 'En lectura ✓' : 'Leer ahora'" class="boton-primario boton-leer"
                  [isEnabled]="!codigosEnLectura.has(pedido.codigo)" (tap)="leerAhora(pedido)"></Button>
        </StackLayout>
        <Button col="1" text="★" class="estrella estrella-activa" accessibilityLabel="Quitar de favoritos" (tap)="quitar(pedido)" verticalAlignment="top"></Button>
      </GridLayout>
    </ng-template>
  </ListView>
</GridLayout>
